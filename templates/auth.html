{% extends 'layout.html' %}
{% from '_icons.html' import icon %}
{% block title %}{{ t('安全验证') }} - {{ t('Prompt 管理器') }}{% endblock %}
{% block content %}
  <div class="auth-shell">
    <section class="auth-panel" aria-labelledby="authTitle">
      <a class="auth-brand" href="{{ url_for('index') }}"><img src="{{ url_for('logo_png') }}" alt="" width="36" height="36" /><span>Prompt Manager</span></a>
      <div class="auth-icon" aria-hidden="true">{{ icon('lock') }}</div>
      <h1 id="authTitle">{{ t('欢迎回来') }}</h1>
      <p class="auth-subtitle">{{ t('输入访问密码以继续进入知识库。') }}</p>

      <form method="post" class="auth-form">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}" />
        <input type="hidden" name="next" value="{{ next }}" />
        <div class="field">
          <label for="password">{{ t('访问密码') }}</label>
          <div class="password-input-wrap">{{ icon('key') }}<input type="password" id="password" name="password" placeholder="{{ t('请输入密码') }}" autocomplete="current-password" required autofocus /></div>
        </div>
        <button type="submit" class="btn primary block">{{ icon('unlock') }} {{ t('进入知识库') }}</button>
      </form>
    </section>
    <button id="themeToggleAuth" class="auth-theme-toggle" type="button" aria-label="{{ t('切换主题') }}" title="{{ t('切换主题') }}">{{ icon('sun') }}<span>{{ t('切换主题') }}</span></button>
  </div>
{% endblock %}
