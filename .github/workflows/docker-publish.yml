name: Build and publish Docker image

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

# Least-privilege: only need to read the repo and write packages (GHCR).
permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gzc888/prompt-manage

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff
        run: ruff check app.py wsgi.py gunicorn.conf.py promptmanage tests

      - name: Check Python syntax
        run: python -m compileall -q app.py wsgi.py gunicorn.conf.py promptmanage

      - name: Check JavaScript syntax
        run: for file in static/js/*.js; do node --check "$file"; done

      - name: Check entrypoint syntax
        run: sh -n docker-entrypoint.sh

      - name: Check template syntax
        env:
          APP_ENV: testing
          SECRET_KEY: ci-only-secret-0123456789abcdef0123456789abcdef
          DB_PATH: /tmp/ci-template-check.sqlite3
        run: |
          python - <<'EOF'
          from promptmanage import app
          for name in app.jinja_env.list_templates():
              app.jinja_env.get_template(name)
          print(f"{len(app.jinja_env.list_templates())} templates compile")
          EOF

      - name: Validate Compose configuration
        env:
          PROMPT_MANAGE_IMAGE: ghcr.io/example/prompt-manage:sha-test
          SECRET_KEY: ci-only-secret-0123456789abcdef0123456789abcdef
        run: docker compose config --quiet

  build-and-push:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # :latest only for the default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # per-commit tag like sha-abc1234
            type=sha,prefix=sha-,format=short
            # git tags -> version tags (v1.2.3 -> 1.2.3 and 1.2)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # branch name (e.g. main) for traceability
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
